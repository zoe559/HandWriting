name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: |
          node --check server.mjs
          for file in public/js/*.js tools/*.mjs; do
            node --check "$file"
          done
      - name: Data check
        run: node tools/check.mjs
      - name: Shell syntax
        run: sh -n start.sh
