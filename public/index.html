<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>CET-6 手写练习台</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">CET-6</span>
        <span class="brand-name">手写练习台</span>
      </div>
      <label class="paper-picker">
        <span>试卷</span>
        <select id="paperSelect" aria-label="选择试卷"></select>
      </label>
      <div class="top-meta">
        <span id="timer" class="timer" title="本次练习用时">00:00</span>
        <span id="saveState" class="save-state">未保存</span>
      </div>
      <div class="top-actions">
        <button id="centerBtn" class="btn ghost" type="button">学习中心</button>
        <button id="helpBtn" class="btn ghost" type="button">使用说明</button>
        <button id="deviceBtn" class="btn ghost" type="button">设备测试</button>
      </div>
    </header>

    <div class="toolbar" id="toolbar" role="toolbar" aria-label="手写工具栏">
      <div class="tool-group colors" role="group" aria-label="笔色">
        <button class="color-dot selected" data-color="#1a4fd6" style="--c: #1a4fd6" title="蓝色" aria-label="蓝色"></button>
        <button class="color-dot" data-color="#d92d20" style="--c: #d92d20" title="红色" aria-label="红色"></button>
        <button class="color-dot" data-color="#111111" style="--c: #111111" title="黑色" aria-label="黑色"></button>
      </div>
      <span class="divider"></span>
      <div class="tool-group widths" role="group" aria-label="笔宽">
        <button class="width-btn" data-width="2" title="细">细</button>
        <button class="width-btn selected" data-width="3.5" title="中">中</button>
        <button class="width-btn" data-width="5" title="粗">粗</button>
      </div>
      <span class="divider"></span>
      <div class="tool-group tools">
        <button id="penBtn" class="btn tool selected" data-tool="pen" type="button">笔</button>
        <button id="eraserBtn" class="btn tool" data-tool="eraser" type="button">橡皮</button>
        <button id="undoBtn" class="btn tool" type="button" title="Ctrl+Z">撤销</button>
        <button id="redoBtn" class="btn tool" type="button" title="Ctrl+Y">重做</button>
        <button id="clearBtn" class="btn tool danger" type="button">清空本页</button>
        <button id="readBtn" class="btn tool" type="button">阅读模式</button>
      </div>
      <span class="divider"></span>
      <label class="zoom">
        <span>缩放</span>
        <select id="zoomSelect" aria-label="页面缩放">
          <option value="1">100%</option>
          <option value="1.15">115%</option>
          <option value="1.3">130%</option>
        </select>
      </label>
      <div class="page-nav">
        <button id="prevBtn" class="btn tool" type="button">上一页</button>
        <span id="pageLabel" class="page-label">1 / 1</span>
        <button id="nextBtn" class="btn tool" type="button">下一页</button>
      </div>
      <span class="spacer"></span>
      <span id="inkCount" class="ink-count">笔迹 0</span>
    </div>

    <main class="stage">
      <div id="pages" class="pages" aria-live="polite">
        <div class="loading">正在加载试卷…</div>
      </div>
    </main>

    <div class="bottom-bar">
      <div class="hint">
        答案写在每题右侧「答」框；选词填空写文内横线；中文注解写右侧留白。
      </div>
      <button id="submitBtn" class="btn primary" type="button">提交批改</button>
    </div>

    <div id="modal" class="modal" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-label="对话框">
        <button id="modalClose" class="modal-close" type="button" aria-label="关闭">×</button>
        <div id="modalBody"></div>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>
    <div id="debugPanel" class="debug-panel" hidden></div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
